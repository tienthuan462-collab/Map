<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1f2a2e;overflow:hidden}
#map{position:absolute;inset:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:88%;background:rgba(31,42,46,.93);color:#fff;font-size:14px;line-height:1.4;padding:9px 15px;border-radius:18px;z-index:9;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center}
#toast.on{opacity:1}
button{font:inherit;font-size:14px;padding:10px 8px;border:1px solid #b9c4c7;border-radius:8px;background:#f3f6f6;color:#1f2a2e}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1a73e8;outline-offset:1px}
.maplibregl-ctrl-group button{width:44px;height:44px}
.maplibregl-ctrl-top-right{margin-top:env(safe-area-inset-top,0px)}
.maplibregl-ctrl-bottom-right{bottom:var(--sh,0px);margin-bottom:env(safe-area-inset-bottom,0px)}
.hqm{width:30px;height:30px;cursor:pointer}   /* không đặt position: MapLibre tự đặt position:absolute để ghim bám đúng tọa độ */
.hqm .ring{width:30px;height:30px;box-sizing:border-box;border-radius:50%;border:2px solid #333;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;overflow:hidden}
.hqm img{width:16px;height:16px;object-fit:contain}
.hqm .lb{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;padding:0 7px;border-radius:9px;color:#fff;font:700 12px/18px system-ui,sans-serif;border:1.5px solid #fff;white-space:nowrap}

/* Nút "Lớp" + bảng chọn lớp (UBND...) */
#lyr-btn{position:fixed;right:10px;top:calc(64px + env(safe-area-inset-top,0px));z-index:5;width:44px;height:44px;padding:0;border:0;border-radius:8px;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
#lyr-btn svg{width:26px;height:26px;fill:#37474f}
#lyr-btn.on{background:#0f766e}
#lyr-btn.on svg{fill:#fff}
#lyr{position:fixed;right:10px;top:calc(116px + env(safe-area-inset-top,0px));z-index:7;width:min(290px,calc(100vw - 20px));max-height:60vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.3);padding:6px 10px 10px}
#lyr[hidden]{display:none}
.lyr-h{font-weight:700;font-size:15px;padding:8px 0 4px}
.lyr-it{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid #e3e8e9;font-size:15px}
.lyr-it input{width:24px;height:24px;flex:none;accent-color:#0f766e}
.lyr-it .dt{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #999;flex:none}
.lyr-it span:nth-of-type(2){flex:1}
.lyr-it small{color:#5f6b70}
#lyr-off{width:100%;margin-top:6px}

/* Logo D1/D2/D3/E07 luôn nằm trên mọi thứ khác */
.hqm{z-index:5}

.tip{pointer-events:none}
.tip .maplibregl-popup-content{padding:0;overflow:hidden;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.35)}
.tipc{border-left:6px solid #dc2626;padding:8px 12px;font-size:13px;color:#5f6b70}
.tipc b{display:block;font-size:15px;color:#1f2a2e}
/* Thẻ thông tin (popup): dải màu đầu thẻ, tên to, nhãn tỉnh, nút lớn */
.pcard .maplibregl-popup-content{padding:0;min-width:240px;border-radius:14px;overflow:hidden;box-shadow:0 4px 22px rgba(0,0,0,.38)}
.pcard .maplibregl-popup-close-button{color:#fff;font-size:26px;width:38px;height:38px;line-height:32px;border-radius:0 14px 0 0}
.pcard .maplibregl-popup-close-button:hover{background:rgba(0,0,0,.18)}
.pc-h{display:flex;align-items:center;gap:10px;padding:12px 42px 12px 12px;color:#fff}
.pc-logo{width:46px;height:46px;flex:none;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.pc-logo img{width:30px;height:30px;object-fit:contain}
.pc-t small{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.92}

.lyr-fn{display:block;width:100%;text-align:left;margin-top:6px;padding:10px;font-weight:700}
.lyr-fn small{display:block;color:#5f6b70;font-weight:400}
.pop{font-size:14px;line-height:1.45;max-width:240px}
.pop button,.pc-b button{display:block;width:100%;margin-top:6px;padding:10px;font-size:14px}
.pri{background:#1a73e8;border-color:#1a73e8;color:#fff;font-weight:700}
#rp-near{flex:1;background:#fff3e0;border-color:#ef6c00;color:#7a3500;font-weight:700}
.alt .rk{display:inline-block;min-width:22px;margin-right:6px;text-align:center;border-radius:50%;background:#1f2a2e;color:#fff;font-size:13px}

.rp[hidden],.sheet[hidden]{display:none}
.rp-row{display:flex;gap:6px;margin-bottom:6px}

#rp-sug .msg{padding:1px 4px 3px;color:#44545a}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.25);padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));z-index:6;font-size:14px;line-height:1.4}
.alt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:2px solid #d5dde0;border-radius:10px;margin:0 0 6px;cursor:pointer}
.alt.sel{border-color:#1a73e8;background:#e8f0fe}
.alt b{font-size:17px}
.alt small{display:block;color:#44545a}
.alt .tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;background:#188038;color:#fff;font-size:11px}
.alt .d{font-weight:700;font-size:16px;white-space:nowrap}
#ed{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:#fff;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.3);padding:8px;z-index:8}
#ed textarea{box-sizing:border-box;width:100%;height:118px;font:12px/1.4 ui-monospace,Consolas,monospace;border:1px solid #b9c4c7;border-radius:8px;padding:6px}
#ed button{margin-top:6px;width:100%}
#rp-sug .it small,#sheet .it small{display:block;color:#5f6b70}
#rp-sug .it.srch{color:#1a73e8;font-weight:600}
#loading{position:fixed;inset:0;z-index:20;background:#eef2f3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;transition:opacity .35s}
#loading.off{opacity:0;pointer-events:none}
#loading b{font-size:20px}
#loading span{font-size:15px;color:#33454b}
#loading small{font-size:13px;color:#5f6b70;max-width:300px}
.spin{width:44px;height:44px;border:5px solid #cfd8dc;border-top-color:#0f766e;border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cal{border-top:1px dashed #b9c4c7;margin-top:8px;padding-top:8px;font-size:13px}
.cal .out{white-space:pre-line;margin:4px 0}
.cal input{width:84px;font:inherit;font-size:14px;padding:6px;border:1px solid #b9c4c7;border-radius:8px}
.cal button{padding:6px 10px;font-size:13px;margin:2px 4px 2px 0}
.lnk{display:block;width:100%;margin:2px 0 4px}
</style>

<body>
<div id="map"></div>
<div id="loading"><div class="spin"></div><b>Đang tải bản đồ…</b><span id="load-sub">Đang tải dữ liệu 3 tỉnh…</span><small>Lần đầu có thể mất vài chục giây, các lần sau sẽ nhanh hơn.</small></div>
<div class="rp" id="rp" hidden>
  <div class="rp-row"><input id="rp-from" placeholder="Điểm đi: chạm bản đồ hoặc gõ tên đường" autocomplete="off" enterkeyhint="search"><button id="rp-me" aria-label="Dùng vị trí của tôi">Vị trí tôi</button></div>
  <div class="rp-row"><input id="rp-to" placeholder="Điểm đến: gõ tên đường, địa điểm" autocomplete="off" enterkeyhint="search"><button id="rp-swap" aria-label="Đổi chiều đi và đến">⇅</button></div>
  <div class="rp-row"><select id="rp-prof" aria-label="Phương tiện"><option value="driving-car">Ô tô</option><option value="moto">Xe máy</option></select><button id="rp-ok">OK</button><button id="rp-close" aria-label="Đóng">✕</button></div>
  <div class="rp-row"><button id="rp-near">★ Đơn vị gần nhất (D1, D2, D3)</button></div>
  <div id="rp-sug"></div>
</div>
<button id="lyr-btn" aria-label="Menu: lớp bản đồ và chức năng" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg></button>
<div id="lyr" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="config.js"></script>
<script src="tru-so.js"></script>
<script>
const CONFIG = Object.assign({
  GOONG_API_KEY: '',                           // khóa REST API của Goong (dán trong config.js)
  GOONG_BASE: 'https://rsapi.goong.io',
  GOONG_MOTO_VEHICLE: 'bike',                  // loại xe gửi cho Goong khi chọn "Xe máy" (car | bike | taxi | truck | hd): nên đối chiếu với Google Maps
  AUTOCOMPLETE_ON_TYPE: true,                  // true: vừa gõ vừa gợi ý bằng Goong (tốn lượt gọi); false: chỉ tìm khi bấm Enter
  STYLE_URL: 'https://tiles.openfreemap.org/styles/liberty',   // nền OpenStreetMap (miễn phí, không cần khóa)
  GOONG_STYLE_URL: 'https://tiles.goong.io/assets/goong_map_web.json',   // nền Goong: ĐỐI CHIẾU với địa chỉ style trong trang hướng dẫn của Goong
  GOONG_MAPTILES_KEY: '',                      // khóa "Maptiles" của Goong (khác khóa REST API); dán trong config.js
  CENTER: [108.4, 12.2], ZOOM: 7, MIN_ZOOM: 6,
  BOUNDS: [[105.5, 9.5], [110.5, 15.0]],
  SEARCH_BBOX: [106.3, 10.3, 109.7, 14.0],   // khung tìm địa điểm: tây, nam, đông, bắc
  LOGO: 'logo.png',
  // CÁC NGUỒN TÌM ĐƯỜNG: bấm OK sẽ hỏi song song tất cả nguồn đang bật, gộp lại và bỏ tuyến trùng nhau.
  // Đặt false để tắt một nguồn. OSRM chỉ dùng cho ô tô; Valhalla có cả xe máy (motor_scooter).
  ENGINES: { goong: true, osrm: true, valhalla: true },
  OSRM_BASE: 'https://router.project-osrm.org',          // máy chủ demo công cộng, miễn phí, không cam kết ổn định
  VALHALLA_BASE: 'https://valhalla1.openstreetmap.de',   // máy chủ công cộng của OpenStreetMap Đức, miễn phí
  MAX_ROUTES: 5,                                         // số tuyến tối đa hiển thị
  ROUTE_TIMEOUT_MS: 12000,
  NEAREST_UNITS: ['D1', 'D2', 'D3'],           // các đơn vị được so sánh khi bấm "Đơn vị gần nhất" (khớp với name trong tru-so.js)
  // DANH SÁCH LỚP trong nút "Lớp". Muốn thêm lớp mới: thêm 1 dòng, rồi đặt kieu tương ứng cho các điểm trong tru-so.js
  // (ví dụ lớp khu công nghiệp: { id: 'kcn', name: 'Khu công nghiệp', kieu: 'kcn', color: '#2e7d32' }). Bỏ "tinh" nếu muốn gộp mọi tỉnh vào một lớp.
  LAYERS: [
    { id: 'ub-dl', name: 'Ủy ban Đắk Lắk',   kieu: 'rieng', tinh: 'Đắk Lắk',   color: '#dc2626' },
    { id: 'ub-kh', name: 'Ủy ban Khánh Hòa', kieu: 'rieng', tinh: 'Khánh Hòa', color: '#dc2626' },
    { id: 'ub-ld', name: 'Ủy ban Lâm Đồng',  kieu: 'rieng', tinh: 'Lâm Đồng',  color: '#dc2626' },
    // Chấm xanh khu công nghiệp: thêm điểm vào tru-so.js với kieu: 'kcn' là tự hiện (xem mẫu cuối tệp tru-so.js)
    { id: 'kcn', name: 'Khu công nghiệp', kieu: 'kcn', color: '#16a34a', dark: '#14532d' }
  ],
}, window.USER_CONFIG || {});
const HQS = window.HQS || [];
const EDIT = new URLSearchParams(location.search).has('edit');
const loadMsg = t => { const el = document.getElementById('load-sub'); if (el) el.textContent = t; };
let dataCount = 0;
const DATA = ['lam-dong', 'khanh-hoa', 'dak-lak', 'tinh'].map(n => (async () => {   // tải đồng thời cả 4 tệp, bắt đầu ngay từ đầu
  for (const ext of ['.json', '.geojson']) {
    try { const r = await fetch('data/' + n + ext); if (r.ok) { const j = await r.json(); loadMsg('Đã tải ' + (++dataCount) + '/4 tệp dữ liệu…'); return j; } } catch (e) { /* thử đuôi khác */ }
  }
  throw new Error('không tải được data/' + n);
})());
DATA.forEach(p => p.catch(() => {}));

const $ = id => document.getElementById(id);
let toastT;
function say(t, ms = 4500) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), ms); }
const EMPTY = { type: 'FeatureCollection', features: [] };

/*PURE-START*/
function inRing(p, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inGeom(p, g) {
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
  return polys.some(poly => inRing(p, poly[0]) && !poly.slice(1).some(h => inRing(p, h)));
}
function ringInfo(r) {
  let a = 0, x = 0, y = 0;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const f = r[j][0] * r[i][1] - r[i][0] * r[j][1];
    a += f; x += (r[j][0] + r[i][0]) * f; y += (r[j][1] + r[i][1]) * f;
  }
  return { area: Math.abs(a) / 2, c: a ? [x / (3 * a), y / (3 * a)] : r[0] };
}
function labelPoint(polys) {
  let best = polys[0], ba = -1;
  polys.forEach(p => { const i = ringInfo(p[0]); if (i.area > ba) { ba = i.area; best = p; } });
  const ring = best[0], c = ringInfo(ring).c;
  if (inRing(c, ring)) return c;
  const xs = ring.map(q => q[0]), ys = ring.map(q => q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  let bp = null, bd = Infinity;
  for (let i = 1; i < 24; i++) for (let j = 1; j < 24; j++) {
    const q = [x0 + (x1 - x0) * i / 24, y0 + (y1 - y0) * j / 24];
    if (!inRing(q, ring)) continue;
    const d = (q[0] - c[0]) ** 2 + (q[1] - c[1]) ** 2;
    if (d < bd) { bd = d; bp = q; }
  }
  return bp || ring[0];
}
function coordsOf(features) {
  const out = [];
  const walk = c => { if (typeof c[0] === 'number') out.push(c); else c.forEach(walk); };
  features.forEach(f => walk(f.geometry.coordinates));
  return out;
}
function bboxOf(pts) {
  let w = 180, s = 90, e = -180, n = -90;
  pts.forEach(p => { if (p[0] < w) w = p[0]; if (p[0] > e) e = p[0]; if (p[1] < s) s = p[1]; if (p[1] > n) n = p[1]; });
  return [[w, s], [e, n]];
}
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase();
const fmtD = m => m < 1000 ? Math.max(10, Math.round(m / 10) * 10) + ' m' : (m / 1000).toFixed(m < 100000 ? 1 : 0) + ' km';
const fmtT = s => { const m = Math.max(1, Math.round(s / 60)); return m >= 60 ? Math.floor(m / 60) + ' giờ ' + (m % 60) + ' phút' : m + ' phút'; };
function viGoong(s) {   // bước chỉ đường của Goong (định dạng giống Google: html_instructions + maneuver)
  const txt = String(s.html_instructions || '').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
  if (txt) return txt;   // Goong thường đã trả sẵn câu hướng dẫn
  const M = { 'turn-left': 'Rẽ trái', 'turn-right': 'Rẽ phải', 'turn-slight-left': 'Chếch sang trái', 'turn-slight-right': 'Chếch sang phải',
    'turn-sharp-left': 'Rẽ trái gắt', 'turn-sharp-right': 'Rẽ phải gắt', 'uturn-left': 'Quay đầu xe', 'uturn-right': 'Quay đầu xe', 'straight': 'Đi thẳng',
    'roundabout-left': 'Vào vòng xuyến', 'roundabout-right': 'Vào vòng xuyến', 'merge': 'Nhập làn', 'ramp-left': 'Vào đường dẫn', 'ramp-right': 'Vào đường dẫn',
    'fork-left': 'Ở ngã ba, đi trái', 'fork-right': 'Ở ngã ba, đi phải' };
  return M[s.maneuver] || 'Tiếp tục';
}
function viaOf(steps) {   // "Qua ..." = tên đường chiếm quãng dài nhất
  let best = null;
  steps.forEach(s => { if (s.n && s.n !== '-' && (!best || s.d > best.d)) best = s; });
  return best ? 'Qua ' + best.n : '';
}
function trimIslands(f, maxLng = 110.5) {   // bỏ phần đảo xa (kinh độ >= 110,5) cho nhẹ
  const g = f.geometry; if (!g) return false;
  if (g.type === 'MultiPolygon') { g.coordinates = g.coordinates.filter(p => p[0][0][0] < maxLng); return g.coordinates.length > 0; }
  if (g.type === 'Polygon') return g.coordinates[0][0][0] < maxLng;
  return false;
}
function decodePoly(str, prec = 5) {   // giải mã polyline của Goong (kiểu Google: 5 chữ số thập phân)
  let i = 0, lat = 0, lng = 0; const out = [], f = Math.pow(10, prec);
  while (i < str.length) {
    let b, shift = 0, res = 0;
    do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32);
    lat += (res & 1) ? ~(res >> 1) : res >> 1;
    shift = 0; res = 0;
    do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32);
    lng += (res & 1) ? ~(res >> 1) : res >> 1;
    out.push([lng / f, lat / f]);
  }
  return out;
}
/*PURE-END*/

/* ===== Ranh giới xã/phường 3 tỉnh (file tạo bằng merge.html, đặt trong data/) ===== */
const PROV = [
  { id: 'lamdong', name: 'Lâm Đồng', color: '#8e24aa', dark: '#6a1b9a' },
  { id: 'khanhhoa', name: 'Khánh Hòa', color: '#ef6c00', dark: '#bf360c' },
  { id: 'daklak', name: 'Đắk Lắk', color: '#2e7d32', dark: '#1b5e20' }
];
const wardData = {}, PBOX = [];
const NAME_KEYS = ['name_with_type', 'full_name', 'name', 'Name', 'NAME', 'ten', 'ten_xa', 'ward_name', 'WARD_NAME'];
function wardName(p) {
  for (const k of NAME_KEYS) if (typeof p[k] === 'string' && p[k]) return p[k];
  for (const k in p) if (typeof p[k] === 'string' && p[k] && k[0] !== '_') return p[k];
  return p._file || '(không rõ tên)';
}
function wardFeat(p) {
  for (const id in wardData) for (const f of wardData[id]) if (inGeom(p, f.geometry)) return f;
  return null;
}
function findWard(p) { const f = wardFeat(p); return f ? f.properties : null; }
function buildProvinces(results) {
  const failed = [];
  PROV.forEach((pv, i) => {
    const r = results[i];
    if (!r || r.status !== 'fulfilled') { failed.push(pv.name); return; }
    const g = r.value;
    g.features = g.features.filter(f => trimIslands(f));
    g.features.forEach(f => { f.properties = f.properties || {}; f.properties._ten = wardName(f.properties); f.properties._tinh = pv.name; });
    wardData[pv.id] = g.features;
    const bb = bboxOf(coordsOf(g.features)); PBOX.push([bb[0][0], bb[0][1], bb[1][0], bb[1][1]]);
    map.addSource(pv.id, { type: 'geojson', data: g, maxzoom: 12, tolerance: 0.5 });
    // Tô màu xã/phường nhạt khi nhìn xa, mờ dần khi phóng to để không che tên đường
    map.addLayer({ id: pv.id + '-fill', type: 'fill', source: pv.id, paint: { 'fill-color': pv.color, 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 7, 0.22, 11, 0.16, 14, 0.08, 16, 0.03] } }, 'routes-casing');
    // Viền xã/phường: mảnh khi nhìn xa (đỡ rối), dày dần khi phóng to
    map.addLayer({ id: pv.id + '-line', type: 'line', source: pv.id, layout: { 'line-join': 'round' }, paint: { 'line-color': pv.dark, 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.3, 10, 0.8, 13, 1.6, 16, 2.4], 'line-opacity': ['interpolate', ['linear'], ['zoom'], 7, 0.4, 11, 0.7, 14, 0.9] } }, 'routes-casing');
    // Tên xã/phường: chữ lớn dần theo mức phóng, viền trắng dày, xuống dòng khi tên dài
    map.addLayer({ id: pv.id + '-label', type: 'symbol', source: pv.id, minzoom: 9.5, maxzoom: 15.5,
      layout: { 'text-field': ['get', '_ten'], 'text-font': ['Noto Sans Bold'], 'text-size': ['interpolate', ['linear'], ['zoom'], 9.5, 10, 12, 12, 14, 15], 'text-max-width': 6, 'text-padding': 4 },
      paint: { 'text-color': pv.dark, 'text-halo-color': '#ffffff', 'text-halo-width': 2.2, 'text-halo-blur': 0.4 } });
  });
  if (failed.length) say('Chưa tải được: ' + failed.join(', ') + '. Kiểm tra thư mục data/.', 20000);
}

/* ===== Chỉ hiện 3 tỉnh: che vùng ngoài, viền tỉnh đậm, tên tỉnh khi thu nhỏ (cần data/tinh.json) ===== */
function buildTinh(res) {
  if (!res || res.status !== 'fulfilled') { say('Chưa có data/tinh.json nên chưa ẩn được vùng ngoài 3 tỉnh.', 12000); return; }
  const g = res.value;
  g.features = g.features.filter(f => trimIslands(f));
  const holes = [], pts = [];
  g.features.forEach(f => {
    const gm = f.geometry, polys = gm.type === 'Polygon' ? [gm.coordinates] : gm.coordinates;
    polys.forEach(p => holes.push(p[0]));
    pts.push({ type: 'Feature', properties: { name: f.properties._tinh }, geometry: { type: 'Point', coordinates: labelPoint(polys) } });
  });
  const first = PROV.map(p => p.id + '-fill').find(id => map.getLayer(id)) || 'routes-casing';
  map.addSource('mask', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [[[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]], ...holes] } }, maxzoom: 10 });
  map.addSource('tinh', { type: 'geojson', data: g, maxzoom: 12, tolerance: 0.5 });
  map.addSource('tinh-pts', { type: 'geojson', data: { type: 'FeatureCollection', features: pts } });
  const byProv = (a, b, c, d) => ['match', ['get', '_tinh'], 'Lâm Đồng', a, 'Khánh Hòa', b, 'Đắk Lắk', c, d];
  map.addLayer({ id: 'mask-fill', type: 'fill', source: 'mask', paint: { 'fill-color': '#e4eaec', 'fill-opacity': 1 } }, first);
  map.addLayer({ id: 'tinh-casing', type: 'line', source: 'tinh', layout: { 'line-join': 'round' }, paint: { 'line-color': '#ffffff', 'line-opacity': 0.95, 'line-width': ['interpolate', ['linear'], ['zoom'], 5, 5, 9, 8, 13, 11] } }, 'routes-casing');
  map.addLayer({ id: 'tinh-line', type: 'line', source: 'tinh', layout: { 'line-join': 'round' }, paint: { 'line-color': byProv('#6a1b9a', '#bf360c', '#1b5e20', '#111111'), 'line-width': ['interpolate', ['linear'], ['zoom'], 5, 2.5, 9, 4.5, 13, 6] } }, 'routes-casing');
  map.addLayer({ id: 'tinh-label', type: 'symbol', source: 'tinh-pts', maxzoom: 10.5,
    layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Bold'], 'text-transform': 'uppercase', 'text-letter-spacing': 0.08,
      'text-size': ['interpolate', ['linear'], ['zoom'], 5, 15, 7, 22, 10, 28], 'text-allow-overlap': true, 'text-ignore-placement': true },
    paint: { 'text-color': byProv('#4a148c', '#8c2a00', '#0d3b12', '#111111'), 'text-halo-color': '#ffffff', 'text-halo-width': 3 } });
}

/* ===== Khung nhìn: phóng ra hết cỡ thì phần đất liền 3 tỉnh nằm chính giữa màn hình ===== */

const HQ_COLOR = { 'Lâm Đồng': '#6a1b9a', 'Khánh Hòa': '#bf360c', 'Đắk Lắk': '#1b5e20' };

function openHQ(h) {
  const w = findWard([h.lng, h.lat]);
  const card = mkCard({ color: h.color || HQ_COLOR[h.tinh] || '#333', logo: true, title: h.name, sub: h.ten || h.tinh, chip: h.tinh,

let edTA = null;
const edText = () => '// DANH SÁCH TRỤ SỞ (chép toàn bộ nội dung này vào tệp tru-so.js)\nwindow.HQS = [\n' +
  HQS.map(h => '  { name: ' + JSON.stringify(h.name) + ', tinh: ' + JSON.stringify(h.tinh) + ', ten: ' + JSON.stringify(h.ten || '') + ', lat: ' + (+h.lat).toFixed(6) + ', lng: ' + (+h.lng).toFixed(6) + (h.kieu ? ', kieu: ' + JSON.stringify(h.kieu) : '') + ' }').join(',\n') + '\n];\n';
function focusHQ(h) {   // chạm logo: phóng to tới trụ sở (hiện tên đường xung quanh) rồi mở thông tin

  map.once('moveend', () => openHQ(h));
}

/* --- Đổi nền: setStyle xóa mọi nguồn/lớp tự thêm, nên chụp lại trước rồi dựng lại sau khi nền mới nạp xong --- */
const isCustomSrc = id => !!id && (PROV.some(p => p.id === id) || ['mask', 'tinh', 'tinh-pts', 'routes', 'hl'].includes(id) || id.indexOf('lyr-') === 0);
let snap = null;
function snapshotCustom() {
  const st = map.getStyle(); snap = { sources: {}, layers: st.layers.filter(l => isCustomSrc(l.source)) };
  Object.keys(st.sources).forEach(id => { if (isCustomSrc(id)) snap.sources[id] = st.sources[id]; });
}
function fixFonts() {   // chữ của các lớp mình thêm phải dùng phông mà nền hiện tại có; lấy phông đậm đầu tiên trong chính style của nền
  const st = map.getStyle(); let f = null;
  st.layers.forEach(l => { const tf = l.layout && l.layout['text-font']; if (!f && !isCustomSrc(l.source) && Array.isArray(tf) && tf.every(x => typeof x === 'string') && tf.some(x => /bold/i.test(x))) f = tf; });
  if (f) st.layers.forEach(l => { if (isCustomSrc(l.source) && l.type === 'symbol') map.setLayoutProperty(l.id, 'text-font', f); });
}
async function setBase(n) {   // trả về false nếu không đổi được (khi đó bảng chọn quay về nền cũ)
  if (n === curBase) return true;
  if (n === 'goong') {   // thử tải style trước để báo lỗi rõ ràng, tránh để bản đồ trắng
    if (!CONFIG.GOONG_MAPTILES_KEY) { say('Chưa có khóa bản đồ Goong. Thêm GOONG_MAPTILES_KEY vào config.js.', 7000); return false; }
    try { const r = await fetch(goongStyleUrl()); if (!r.ok) throw new Error('mã lỗi ' + r.status); await r.json(); }
    catch (e) { say('Không tải được nền Goong (' + e.message + '). Kiểm tra khóa và địa chỉ style.', 8000); return false; }
  }
  snapshotCustom();
  map.once('style.load', () => {
    Object.keys(snap.sources).forEach(id => { if (!map.getSource(id)) map.addSource(id, snap.sources[id]); });
    snap.layers.forEach(l => { if (!map.getLayer(l.id)) map.addLayer(l); });
    fixFonts();
    say('Đã đổi nền: ' + (n === 'goong' ? 'Goong' : 'OpenStreetMap'), 2500);
  });
  map.setStyle(baseUrl(n), { diff: false });
  curBase = n;
  try { localStorage.setItem('ban-do-nen', n); } catch (e) { /* bỏ qua */ }
  return true;
}

/* ===== Lớp ẩn/hiện (UBND...): vẽ bằng lớp bản đồ nên nhẹ, mặc định TẮT; bật trong nút "Lớp" ===== */

    // tên ngắn gọn (bỏ chữ "Ủy Ban Nhân Dân") chỉ hiện khi phóng đủ gần

      'text-size': ['interpolate', ['linear'], ['zoom'], 12.5, 11, 16, 14], 'text-anchor': 'top', 'text-offset': [0, 0.9], 'text-max-width': 8 },
      paint: { 'text-color': L.dark || '#7f1d1d', 'text-halo-color': '#ffffff', 'text-halo-width': 2 } }, 'routes-casing');

/* ===== Chỉ đường kiểu Google Maps: bấm OK mới tìm, nhiều lựa chọn, km và thời gian, hướng dẫn từng bước ===== */

const sleep = ms => new Promise(r => setTimeout(r, ms));
/*GEO-START*/
const allBox = () => PBOX.length ? [Math.min(...PBOX.map(b => b[0])), Math.min(...PBOX.map(b => b[1])), Math.max(...PBOX.map(b => b[2])), Math.max(...PBOX.map(b => b[3]))] : CONFIG.SEARCH_BBOX;
function localHits(q) {   // trụ sở và xã/phường: tìm ngay trên máy, không cần mạng
  const nq = norm(q.trim()); if (!nq) return [];
  const out = HQS.filter(h => norm(h.name + ' ' + (h.ten || '') + ' ' + h.tinh).includes(nq)).map(h => ({ title: h.name + ' – ' + (h.ten || h.tinh), sub: 'Trụ sở', c: [h.lng, h.lat] }));
  if (nq.length >= 2) {
    let n = 0;
    for (const id in wardData) for (const f of wardData[id]) {
      if (n >= 6 || !norm(f.properties._ten).includes(nq)) continue;
      const g = f.geometry, polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
      if (polys.length) { n++; out.push({ title: f.properties._ten, sub: 'Xã/phường · ' + f.properties._tinh, c: labelPoint(polys) }); }
    }
  }
  return out;
}
// Nominatim (OpenStreetMap): chỉ còn là DỰ PHÒNG khi Goong lỗi hoặc chưa có key
async function nomi(q, box) {
  const [w, s, e, n] = box;
  const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=40&accept-language=vi&countrycodes=vn&bounded=1&viewbox=' + [w, n, e, s].join(',') + '&q=' + encodeURIComponent(q));
  if (!r.ok) throw new Error('nominatim ' + r.status);
  return (await r.json()).map(x => ({ title: String(x.display_name).split(', ')[0], c: [+x.lon, +x.lat] }));
}
// ---- Goong ----
// Ưu tiên GOONG_API_KEY; nếu chưa có thì dùng giá trị ORS_API_KEY cũ trong config.js (phòng khi bạn dán key Goong vào ô cũ)
function goongKey() { return CONFIG.GOONG_API_KEY || (window.USER_CONFIG || {}).ORS_API_KEY || ''; }
async function goongGet(path, params) {   // gọi REST API của Goong (GET), trả JSON
  const key = goongKey();
  if (!key) throw new Error('Chưa có key Goong. Mở config.js và đặt GOONG_API_KEY.');
  const u = new URL(CONFIG.GOONG_BASE + path);
  Object.keys(params || {}).forEach(k => { if (params[k] != null) u.searchParams.set(k, params[k]); });
  u.searchParams.set('api_key', key);
  const r = await fetch(u);
  const d = await r.json().catch(() => null);
  if (!r.ok) {
    const m = d && (d.error || d.message || d.error_message);
    throw new Error((m ? String(m.message || m) : 'Goong mã lỗi ' + r.status) + (r.status === 401 || r.status === 403 ? ' (kiểm tra key)' : ''));
  }
  return d || {};
}
const newSession = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
async function goongSuggest(q) {   // gợi ý địa điểm; KHÔNG có toạ độ, toạ độ lấy sau bằng placeDetail khi người dùng chọn
  const b = allBox();
  if (!RP.sess) RP.sess = newSession();   // cùng một phiên gõ → Goong tính tiền gộp
  const d = await goongGet('/Place/AutoComplete', { input: q, location: ((b[1] + b[3]) / 2).toFixed(5) + ',' + ((b[0] + b[2]) / 2).toFixed(5), radius: 300, limit: 10, more_compound: 'true', sessiontoken: RP.sess });
  return (d.predictions || []).map(p => { const sf = p.structured_formatting || {}; return { title: sf.main_text || String(p.description || '').split(',')[0], sub: sf.secondary_text || p.description || '', pid: p.place_id }; });
}
async function placeDetail(pid) {   // lấy toạ độ [lng, lat] của một gợi ý
  const d = await goongGet('/Place/Detail', { place_id: pid, sessiontoken: RP.sess });
  const l = d.result && d.result.geometry && d.result.geometry.location;
  if (!l) throw new Error('Goong không trả toạ độ');
  RP.sess = null;   // chọn xong = kết thúc phiên
  return [+l.lng, +l.lat];
}
async function geocode(q) {
  if (goongKey()) {
    try { const list = await goongSuggest(q); return { list, raw: list.length }; }
    catch (e) { console.warn('Goong lỗi:', e); say('Goong lỗi: ' + e.message + ' (dùng Nominatim dự phòng)', 5000); }
  }
  const seen = new Set(), out = []; let raw = 0;   // dự phòng: Nominatim, chỉ giữ điểm nằm trong 3 tỉnh
  try {
    const list = await nomi(q, allBox()); raw = list.length;
    list.forEach(x => {
      const w = findWard(x.c);
      if (!w && Object.keys(wardData).length) return;
      const k = x.c[0].toFixed(4) + ',' + x.c[1].toFixed(4);
      if (seen.has(k)) return; seen.add(k);
      x.sub = w ? w._ten + ', ' + w._tinh : ''; out.push(x);
    });
  } catch (e) { /* không có nguồn nào trả lời */ }
  const c = map.getCenter(), d2 = x => (x.c[0] - c.lng) ** 2 + (x.c[1] - c.lat) ** 2;
  out.sort((a, b) => d2(a) - d2(b));   // ưu tiên kết quả gần khu vực đang xem
  return { list: out.slice(0, 10), raw };
}
/*GEO-END*/
function showList(k, list, withSearch) {

      RP.seq++; ['from', 'to'].forEach(n => clearTimeout($('rp-' + n)._t));   // bỏ các lần tìm đang chờ

      if (!c && x.pid) {   // gợi ý của Goong chưa có toạ độ → hỏi Place Detail
        say('Đang lấy vị trí…', 2500);

      }
      if (!findWard(c) && Object.keys(wardData).length) { say('Địa điểm này nằm ngoài 3 tỉnh Lâm Đồng, Khánh Hòa, Đắk Lắk.'); return; }
      setPoint(k, c, x.title + (x.sub ? ' · ' + x.sub : ''));

}
async function suggest(k, q) {
  if (q.length < 2) return;
  const my = ++RP.seq;
  sugText('Đang tìm “' + q + '”… (có thể mất vài giây)');
  const loc = localHits(q), { list, raw } = await geocode(q);
  if (my !== RP.seq) return;   // đã có lần tìm mới hơn
  const all = loc.concat(list);
  if (!all.length) { sugText(raw ? 'Có ' + raw + ' kết quả nhưng đều nằm ngoài 3 tỉnh.' : 'Không tìm thấy “' + q + '” trong khu vực. Thử viết khác (thêm “Đường”, bỏ dấu…) hoặc chạm lên bản đồ.'); return; }
  showList(k, all, false);
}
['from', 'to'].forEach(k => {
  const el = $('rp-' + k);
  el.onfocus = () => { RP.active = k; };
  el.oninput = () => {
    const q = el.value.trim();
    if (!q) { RP[k] = null; if (RP.mk[k]) { RP.mk[k].remove(); delete RP.mk[k]; } clearResults(); hint(); return; }
    showList(k, localHits(q), true);   // gợi ý ngay trụ sở và xã/phường (không tốn lượt gọi)
    clearTimeout(el._t);               // debounce: chờ người dùng ngừng gõ 0,7 giây mới gọi Goong
    if (CONFIG.AUTOCOMPLETE_ON_TYPE && goongKey() && q.length >= 3) el._t = setTimeout(() => suggest(k, el.value.trim()), 700);
  };

/* --- Tìm đường: TOÀN BỘ do Goong tính (thời gian, quãng đường, hình dạng, hướng dẫn). Không còn thuật toán tự viết --- */
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('quá thời gian chờ')), ms))]);
const hasKey = () => !!goongKey() && !goongKey().startsWith('DÁN');   // đã có key Goong thật chưa
const goongVeh = () => $('rp-prof').value === 'moto' ? (CONFIG.GOONG_MOTO_VEHICLE || 'bike') : 'car';   // loại xe gửi cho Goong
// Chuẩn hoá một tuyến: dist = mét, dur = giây (đúng số Goong trả về, không nhân hệ số nào)
const mkRoute = (coords, dist, dur, steps) => ({ coords, dist, dur, steps, via: viaOf(steps) });
async function goongRoutes(veh, o, d) {   // Goong Directions: routes[].legs[].steps, overview_polyline mã hoá 5 chữ số; alternatives=true → nhiều tuyến
  // o, d là [lng, lat]; Goong cần "lat,lng"
  const j = await goongGet('/Direction', { origin: o[1] + ',' + o[0], destination: d[1] + ',' + d[0], vehicle: veh, alternatives: 'true' });
  if (!j.routes || !j.routes.length) throw new Error('không có tuyến' + (j.status ? ' (' + j.status + ')' : ''));
  return j.routes.map(rt => {
    if (!rt.overview_polyline || !rt.overview_polyline.points) throw new Error('Goong không trả hình dạng tuyến');
    const legs = rt.legs || [];
    const dist = legs.reduce((sum, l) => sum + ((l.distance && l.distance.value) || 0), 0);
    const dur = legs.reduce((sum, l) => sum + ((l.duration && l.duration.value) || 0), 0);
    const coords = decodePoly(rt.overview_polyline.points, 5);
    const all = legs.flatMap(l => l.steps || []);
    const steps = all.map((st, i) => ({ t: viGoong(st), d: (st.distance && st.distance.value) || 0, n: st.name || '', c: st.start_location ? [st.start_location.lng, st.start_location.lat] : coords[0], end: i === all.length - 1 }));
    const r = mkRoute(coords, dist, dur, steps); r.src = 'Goong';
    if (!r.via && rt.summary) r.via = 'Qua ' + rt.summary;
    return r;
  });
}
// Bấm OK: một lần gọi Goong lấy tất cả tuyến, xếp theo thời gian Goong trả về (tuyến đầu = nhanh nhất)
/*MERGE-START*/
// ---- Gộp tuyến từ nhiều nguồn ----
function mDist(p, a, b) {   // khoảng cách (mét) từ điểm p đến đoạn a-b; tọa độ [lng, lat], xấp xỉ phẳng (đủ chính xác trong vài km)
  const kx = 111320 * Math.cos(p[1] * Math.PI / 180), ky = 110540;
  const px = (p[0] - a[0]) * kx, py = (p[1] - a[1]) * ky, dx = (b[0] - a[0]) * kx, dy = (b[1] - a[1]) * ky, l2 = dx * dx + dy * dy;
  const u = l2 ? Math.max(0, Math.min(1, (px * dx + py * dy) / l2)) : 0;
  return Math.hypot(px - u * dx, py - u * dy);
}
function nearFrac(A, B, tol) {   // tỉ lệ điểm lấy mẫu của A nằm cách đường B không quá tol mét
  const n = Math.min(40, A.length), step = (A.length - 1) / Math.max(1, n - 1); let ok = 0;
  for (let k = 0; k < n; k++) {
    const p = A[Math.round(k * step)]; let best = Infinity;
    for (let i = 1; i < B.length && best > tol; i++) best = Math.min(best, mDist(p, B[i - 1], B[i]));
    if (best <= tol) ok++;
  }
  return ok / n;
}
function sameRoute(a, b, tol = 80, frac = 0.85) {   // trùng nhau nếu phần lớn đường này nằm sát đường kia, và ngược lại
  return a.length > 1 && b.length > 1 && nearFrac(a, b, tol) >= frac && nearFrac(b, a, tol) >= frac;
}
function mergeRoutes(lists, max = 5) {   // lists: mảng các mảng tuyến, nguồn ưu tiên đứng trước; trả về danh sách đã bỏ trùng, xếp theo thời gian
  const out = [];
  lists.forEach(l => l.forEach(r => { if (!out.some(o => sameRoute(o.coords, r.coords))) out.push(r); }));
  return out.sort((a, b) => a.dur - b.dur).slice(0, max);
}
/*MERGE-END*/
async function osrmRoutes(o, d) {   // OSRM demo: chỉ có hồ sơ ô tô; alternatives=3 → tối đa 3 tuyến thay thế
  const r = await fetch(CONFIG.OSRM_BASE + '/route/v1/driving/' + o.join(',') + ';' + d.join(',') + '?alternatives=3&overview=full&geometries=polyline&steps=true');
  if (!r.ok) throw new Error('OSRM mã lỗi ' + r.status);
  const j = await r.json();
  if (j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error('OSRM: không có tuyến');
  return j.routes.map(rt => {
    const steps = (rt.legs || []).flatMap(l => l.steps || []).map(st => ({ t: '', d: st.distance || 0, n: st.name || '', c: null, end: false }));
    const x = mkRoute(decodePoly(rt.geometry, 5), rt.distance, rt.duration, steps); x.src = 'OSRM'; return x;
  });
}
async function valhallaRoutes(o, d, moto) {   // Valhalla: alternates=2 → thêm tối đa 2 tuyến thay thế; xe máy dùng motor_scooter
  const r = await fetch(CONFIG.VALHALLA_BASE + '/route', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ locations: [{ lat: o[1], lon: o[0] }, { lat: d[1], lon: d[0] }], costing: moto ? 'motor_scooter' : 'auto', alternates: 2, directions_language: 'vi-VN' }) });
  if (!r.ok) throw new Error('Valhalla mã lỗi ' + r.status);
  const j = await r.json();
  const trips = [j.trip].concat((j.alternates || []).map(a => a.trip)).filter(Boolean);
  if (!trips.length) throw new Error('Valhalla: không có tuyến');
  return trips.map(t => {
    const legs = t.legs || [];
    const coords = legs.flatMap(l => decodePoly(l.shape, 6));   // Valhalla mã hóa 6 chữ số thập phân
    const steps = legs.flatMap(l => l.maneuvers || []).map(m => ({ t: '', d: (m.length || 0) * 1000, n: (m.street_names || [])[0] || '', c: null, end: false }));
    const x = mkRoute(coords, (t.summary.length || 0) * 1000, t.summary.time || 0, steps); x.src = 'Valhalla'; return x;
  });
}
// Bấm OK: hỏi song song mọi nguồn đang bật; nguồn nào lỗi hoặc chậm thì bỏ qua, nguồn còn lại vẫn hiện
async function getRoute() {
  const E = CONFIG.ENGINES, moto = $('rp-prof').value === 'moto', o = RP.from.c, d = RP.to.c;
  const jobs = [];   // [tên nguồn, promise]
  if (E.goong && hasKey()) jobs.push(['Goong', goongRoutes(goongVeh(), o, d)]);
  if (E.osrm && !moto) jobs.push(['OSRM', osrmRoutes(o, d)]);
  if (E.valhalla) jobs.push(['Valhalla', valhallaRoutes(o, d, moto)]);
  if (!jobs.length) { sugText('Chưa có nguồn tìm đường nào. Kiểm tra key Goong trong config.js hoặc bật ENGINES.'); return; }
  sugText('Đang tìm đường (' + jobs.map(j => j[0]).join(', ') + ')…');
  const my = ++RP.rseq;   // token chống kết quả cũ
  const res = await Promise.allSettled(jobs.map(j => withTimeout(j[1], CONFIG.ROUTE_TIMEOUT_MS)));
  if (my !== RP.rseq) return;   // trong lúc chờ người dùng đã đổi hành trình
  const ok = [], bad = [];
  res.forEach((r, i) => { if (r.status === 'fulfilled' && r.value.length) ok.push(r.value); else { bad.push(jobs[i][0]); console.warn(jobs[i][0], 'lỗi:', r.reason); } });
  if (!ok.length) { sugText('Không tìm được đường: ' + (res[0].reason ? res[0].reason.message : 'không có tuyến')); return; }
  RP.near = null; RP.routes = mergeRoutes(ok, CONFIG.MAX_ROUTES); RP.sel = 0; RP.steps = false;
  sugClear(); showRoutes(true);
  if (bad.length) say('Không lấy được từ: ' + bad.join(', '), 5000);
}

// Đơn vị gần nhất: hỏi Goong đường nhanh nhất từ từng đơn vị (D1, D2, D3) đến điểm đến, rồi xếp hạng theo thời gian
async function nearest() {
  if (!hasKey()) { sugText('Chưa có key Goong. Mở config.js và đặt GOONG_API_KEY.'); return; }
  if (!RP.to) { sugText('Chọn điểm đến trước (chạm bản đồ hoặc gõ tên), rồi bấm lại nút này.'); return; }
  const units = HQS.filter(h => CONFIG.NEAREST_UNITS.includes(h.name));
  if (!units.length) { sugText('Chưa cấu hình đơn vị nào để so sánh (NEAREST_UNITS).'); return; }
  sugText('Đang so sánh ' + units.map(u => u.name).join(', ') + '…');
  const my = ++RP.rseq, to = RP.to.c, veh = goongVeh();
  const res = await Promise.allSettled(units.map(u => withTimeout(goongRoutes(veh, [u.lng, u.lat], to), 15000)));
  if (my !== RP.rseq) return;   // người dùng đã đổi hành trình trong lúc chờ
  const near = [], bad = [];
  res.forEach((r, i) => { if (r.status === 'fulfilled' && r.value.length) near.push({ h: units[i], r: r.value.slice().sort((a, b) => a.dur - b.dur)[0] }); else bad.push(units[i].name); });
  if (!near.length) { sugText('Không tính được đường từ các đơn vị: ' + (res[0].reason ? res[0].reason.message : 'không có tuyến')); return; }
  near.sort((a, b) => a.r.dur - b.r.dur);   // gần nhất = thời gian di chuyển ngắn nhất
  RP.near = near; RP.routes = near.map(n => n.r); RP.sel = 0; RP.steps = false;
  sugClear(); showRoutes(true);
  if (bad.length) say('Không tính được: ' + bad.join(', '), 6000);
}

function gmapsUrl() {
  const m = { 'driving-car': 'driving', 'moto': 'two-wheeler', 'cycling-regular': 'bicycling', 'foot-walking': 'walking' }[$('rp-prof').value] || 'driving';
  const p = c => c[1].toFixed(6) + ',' + c[0].toFixed(6);
  return 'https://www.google.com/maps/dir/?api=1&origin=' + p(RP.near ? [RP.near[RP.sel].h.lng, RP.near[RP.sel].h.lat] : RP.from.c) + '&destination=' + p(RP.to.c) + '&travelmode=' + m;
}
function showRoutes(fit) {
  const R = RP.routes, sh = $('sheet');
  map.getSource('routes').setData({ type: 'FeatureCollection', features: R.map((r, i) => ({ type: 'Feature', properties: { i, sel: i === RP.sel ? 1 : 0 }, geometry: { type: 'LineString', coordinates: r.coords } })) });
  sh.textContent = '';
  if (RP.near) { const hd = document.createElement('div'); hd.className = 'msg'; hd.style.fontWeight = '700'; hd.textContent = 'Xếp hạng theo thời gian di chuyển đến điểm đã chọn'; sh.appendChild(hd); }
  const shortest = R.reduce((m, r, i) => r.dist < R[m].dist ? i : m, 0);
  R.forEach((r, i) => {
    const c = document.createElement('div'); c.className = 'alt' + (i === RP.sel ? ' sel' : '');
    const l = document.createElement('div'), b = document.createElement('b'), sm = document.createElement('small');
    const diff = i > 0 ? Math.round((r.dur - R[0].dur) / 60) : 0;
    if (RP.near) {   // chế độ xếp hạng đơn vị: #1 là đơn vị đến nhanh nhất
      const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = i + 1; b.appendChild(rk);
      b.appendChild(document.createTextNode(RP.near[i].h.name + ' · ~' + fmtT(r.dur)));
      if (i === 0) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'Gần nhất'; b.appendChild(t); }
      sm.textContent = (RP.near[i].h.ten || RP.near[i].h.tinh) + (diff > 0 ? ' · chậm hơn ' + diff + ' phút' : '');
    } else {
      b.textContent = '~' + fmtT(r.dur);
      if (i === 0) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'Nhanh nhất'; b.appendChild(t); }
      else if (i === shortest) { const t = document.createElement('span'); t.className = 'tag'; t.style.background = '#1a73e8'; t.textContent = 'Ngắn nhất'; b.appendChild(t); }
      sm.textContent = (r.via || 'Tuyến ' + (i + 1)) + ' · ' + (r.src || '') + (diff > 0 ? ' · chậm hơn ' + diff + ' phút' : '');
    }
    l.appendChild(b); l.appendChild(sm);
    const d = document.createElement('div'); d.className = 'd'; d.textContent = fmtD(r.dist);
    c.appendChild(l); c.appendChild(d);
    c.onclick = () => { RP.sel = i; showRoutes(false); };
    sh.appendChild(c);
  });
  if (R.length === 1 && !RP.near) { const m = document.createElement('div'); m.className = 'msg'; m.textContent = 'Các nguồn chỉ trả về một tuyến cho hành trình này.'; sh.appendChild(m); }
  const gb = document.createElement('button'); gb.className = 'lnk'; gb.textContent = 'Mở trong Google Maps (giờ có tính kẹt xe, dẫn đường bằng giọng nói)';
  gb.onclick = () => window.open(gmapsUrl(), '_blank', 'noopener'); sh.appendChild(gb);
  const note = document.createElement('div'); note.className = 'msg'; note.style.fontSize = '12px'; note.textContent = 'Mỗi tuyến ghi rõ nguồn tính (Goong, OSRM, Valhalla); thời gian của các nguồn khác nhau có thể lệch nhau và OSRM/Valhalla không tính kẹt xe. Muốn đối chiếu thực tế, bấm “Mở trong Google Maps”.'; sh.appendChild(note);
  sheetShow(!RP.hidden);
  if (fit) map.fitBounds(bboxOf(R.flatMap(r => r.coords)), { padding: { top: 220, bottom: Math.round(sh.offsetHeight + 30), left: 40, right: 70 }, maxZoom: 16 });
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
